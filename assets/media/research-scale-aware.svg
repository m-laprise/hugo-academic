<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
  <title id="title">Scale-aware enforcement</title>
  <desc id="desc">Instance-by-instance enforcement effort rises steeply with the number of instances, while targeting the structure keeps enforcement bounded.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a857b"/>
    </marker>
  </defs>
  <line x1="62" y1="280" x2="480" y2="280" stroke="#b9b3a8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="62" y1="280" x2="62" y2="10" stroke="#b9b3a8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M62 270 C 155 260, 230 145, 350 45" fill="none" stroke="#2b2a28" stroke-width="3.4"/>
  <path d="M62 270 C 165 238, 260 220, 350 212" fill="none" stroke="#b5694e" stroke-width="3.4"/>
  <text x="360" y="43" fill="#4f4b43" font-family="Inter,Arial,sans-serif" font-size="27">act on each</text>
  <text x="360" y="73" fill="#4f4b43" font-family="Inter,Arial,sans-serif" font-size="27">instance</text>
  <text x="360" y="209" fill="#8a4b37" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">target the</text>
  <text x="360" y="239" fill="#8a4b37" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">structure</text>
  <text x="270" y="320" text-anchor="middle" fill="#6b665d" font-family="Inter,Arial,sans-serif" font-size="30">instances of the conduct →</text>
  <text x="25" y="145" text-anchor="middle" transform="rotate(-90 25 145)" fill="#6b665d" font-family="Inter,Arial,sans-serif" font-size="30">enforcement effort →</text>
</svg>
