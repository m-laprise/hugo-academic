{{- $filename := .Get 0 -}}
{{- $summary := .Get 1 | default "Read abstract" -}}
{{- $path := printf "assets/abstracts/%s" $filename -}}
{{- $options := dict "display" "block" -}}
<details class="abstract-details">
  <summary>{{ $summary }}</summary>
  <div class="abstract-content">
    {{ os.ReadFile $path | .Page.RenderString $options }}
  </div>
</details>
